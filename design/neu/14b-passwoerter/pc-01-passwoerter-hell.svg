="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></g><text x="73" y="390" font-family="Nunito" font-size="14.5" font-weight="700" fill="#6A6275" xml:space="preserve">Protokoll</text><g transform="translate(42 421.5) scale(0.79 0.79)" fill="none" stroke="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></g><text x="73" y="436" font-family="Nunito" font-size="14.5" font-weight="700" fill="#6A6275" xml:space="preserve">Einstellungen</text><rect x="30" y="478" width="204" height="62" rx="22" fill="#F3EDE5"/><rect x="44" y="495" width="8" height="8" rx="4" fill="#1F9D6B"/><text x="60" y="503" font-family="Nunito" font-size="13" font-weight="700" fill="#2A2433" xml:space="preserve">Plan läuft</text><text x="44" y="524" font-family="Nunito" font-size="12" font-weight="400" fill="#6A6275" xml:space="preserve">16:40 · nächster Abruf 16:45</text><line x1="30" y1="777.5" x2="234" y2="777.5" stroke="#F0EAE2" stroke-width="1"/><g transform="translate(42 798) scale(0.75 0.75)" fill="none" stroke="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></g><text x="72" y="811.5" font-family="Nunito" font-size="13.5" font-weight="700" fill="#6A6275" xml:space="preserve">Zur App</text><g transform="translate(42 838) scale(0.75 0.75)" fill="none" stroke="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8V5a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-3M10 12h10m0 0l-3-3m3 3l-3 3"/></g><text x="72" y="851.5" font-family="Nunito" font-size="13.5" font-weight="700" fill="#6A6275" xml:space="preserve">Abmelden</text><text x="284" y="39" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Admin · 9b</text><text x="284" y="80" font-family="Nunito" font-size="38" font-weight="900" letter-spacing="-0.57" fill="#2A2433" xml:space="preserve">Passwörter</text><rect x="284" y="110" width="1120" height="40.84" rx="16" fill="#F3EDE5"/><g transform="translate(297 122) scale(0.67 0.67)" fill="none" stroke="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></g><text x="323" y="134.0" font-family="Nunito" font-size="13" font-weight="400" fill="#6A6275" xml:space="preserve"><tspan font-weight="400" fill="#6A6275">Gespeichert wird nur ein Hash. Auch du kannst ein Passwort später nicht mehr ansehen — beim Erzeugen siehst du es genau einmal.</tspan></text><rect x="284" y="172" width="550" height="298" rx="22" fill="#FFFFFF"/><text x="304" y="205.5" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Klassenpasswort</text><text x="814" y="205.5" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" text-anchor="end" xml:space="preserve">Seit 10. Sept · vor 12 Tagen</text><text x="304" y="237" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Neues Passwort</text><rect x="304" y="247" width="510" height="50" rx="16" fill="#FFFFFF"/><text x="321" y="277" font-family="Nunito" font-size="16" font-weight="400" fill="#C0B8C6" xml:space="preserve">mindestens 10 Zeichen</text><g transform="translate(778 262) scale(0.83 0.83)" fill="none" stroke="#978FA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="304" y="315" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Alle Geräte der Klasse werden danach abgemeldet.</text><rect x="304" y="331" width="182" height="48" rx="24.0" fill="#6C4DF6"/><g transform="translate(313.575 347.0) scale(0.67 0.67)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></g><text x="407.0" y="360.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Passwort ändern</text><rect x="496" y="331" width="128" height="48" rx="24.0" fill="#F3EDE5"/><g transform="translate(510.03999999999996 347.0) scale(0.67 0.67)" fill="none" stroke="#2A2433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></g><text x="572.0" y="360.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#2A2433" text-anchor="middle" xml:space="preserve">Erzeugen</text><line x1="304" y1="403" x2="814" y2="403" stroke="#F0EAE2" stroke-width="1"/><text x="304" y="428" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">„Erzeugen“: ORBook denkt sich ein sicheres Passwort aus (12 Zeichen).</text><text x="304" y="446" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Du siehst es nur einmal, direkt danach.</text><rect x="854" y="172" width="550" height="298" rx="22" fill="#FFFFFF"/><text x="874" y="205.5" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Admin-Passwort</text><text x="1384" y="205.5" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" text-anchor="end" xml:space="preserve">nur für dich</text><text x="874" y="237" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Aktuelles Passwort</text><rect x="874" y="247" width="249.0" height="50" rx="16" fill="#FFFFFF"/><g transform="translate(1087.0 262) scale(0.83 0.83)" fill="none" stroke="#978FA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="1135.0" y="237" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Neues Passwort</text><rect x="1135.0" y="247" width="249.0" height="50" rx="16" fill="#FFFFFF"/><text x="1152.0" y="277" font-family="Nunito" font-size="16" font-weight="400" fill="#C0B8C6" xml:space="preserve">mindestens 12 Zeichen</text><g transform="translate(1348.0 262) scale(0.83 0.83)" fill="none" stroke="#978FA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="874" y="315" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Andere Admin-Geräte werden abgemeldet, dieses nicht.</text><rect x="874" y="331" width="232" height="48" rx="24.0" fill="#6C4DF6"/><g transform="translate(881.605 347.0) scale(0.67 0.67)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></g><text x="1002.0" y="360.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Admin-Passwort ändern</text><line x1="874" y1="403" x2="1384" y2="403" stroke="#F0EAE2" stroke-width="1"/><g transform="translate(874 417) scale(0.58 0.58)" fill="none" stroke="#978FA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g><text x="893" y="428" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Vergessen? Neu setzen geht nur auf dem Server:</text><text x="893" y="446" font-family="Nunito" font-size="12" font-weight="700" fill="#6A6275" xml:space="preserve">orbook set-admin-password</text></svg>