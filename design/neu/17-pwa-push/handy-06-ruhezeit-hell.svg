sse</text><text x="18" y="733.78" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Wie unter „Meine Kurse“ – änderst du dort, gilt es hier mit.</text><text x="18" y="771.78" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Ruhe</text><rect x="18" y="785.78" width="354" height="73.5" rx="22" fill="#FFFFFF"/><text x="32" y="819.78" font-family="Nunito" font-size="14.5" font-weight="400" fill="#2A2433" xml:space="preserve">Ruhezeit</text><text x="32" y="838.78" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve"><tspan font-weight="400" fill="#978FA1">Zwischen </tspan><tspan font-weight="700" fill="#4A31C9">21:00</tspan><tspan font-weight="400" fill="#978FA1"> und </tspan><tspan font-weight="700" fill="#4A31C9">06:30</tspan><tspan font-weight="400" fill="#978FA1"> still</tspan></text><rect x="316" y="811.78" width="42" height="24" rx="12" fill="#6C4DF6"/><rect x="336" y="813.78" width="20" height="20" rx="10" fill="#FFFFFF"/><text x="18" y="885.78" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Fällt eine Stunde in der Ruhezeit aus, kommt das um 06:30.</text><rect x="18" y="915.78" width="354" height="48" rx="24" fill="#FFFFFF"/><g transform="translate(86.88000000000001 931.78) scale(0.67 0.67)" fill="none" stroke="#D6455D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 9.5-4.9M18 11v5l2 2H8"/><path d="M10 21h4"/><path d="M4 4l16 16"/></g><text x="205.0" y="944.78" font-family="Nunito" font-size="14" font-weight="700" fill="#D6455D" text-anchor="middle" xml:space="preserve">Auf diesem Gerät ausschalten</text><text x="195" y="993.78" font-family="Nunito" font-size="11.5" font-weight="400" fill="#978FA1" text-anchor="middle" xml:space="preserve">Ohne Namen – der Server kennt nur Gerät und Kurse.</text><rect x="0" y="0" width="390" height="844" fill="#2A2433" fill-o