75" xml:space="preserve">Zuletzt: heute 07:14</text><rect x="268" y="108" width="90" height="32" rx="16" fill="#FFFFFF"/><text x="313" y="129" font-family="Nunito" font-size="12.5" font-weight="800" fill="#4A31C9" text-anchor="middle" xml:space="preserve">Test senden</text><text x="18" y="192" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">So sieht es aus</text><rect x="18" y="206" width="354" height="81.78" rx="22" fill="#F3EDE5"/><g transform="translate(32 218) scale(0.39 0.39)" fill="none"><ellipse cx="38" cy="38" rx="33" ry="13.5" stroke="#6C4DF6" stroke-width="2.6" transform="rotate(-28 38 38)"/><circle cx="38" cy="38" r="11" fill="#2A2433"/><circle cx="64" cy="25" r="4.5" fill="#6C4DF6"/></g><text x="74" y="231" font-family="Nunito" font-size="13" font-weight="700" fill="#2A2433" xml:space="preserve">ORBook · jetzt</text><text x="74" y="251" font-family="Nunito" font-size="13.5" font-weight="400" fill="#2A2433" xml:space="preserve">Morgen: 4. Std Geschichte → Vertretung, Raum</text><text x="74" y="269.9" font-family="Nunito" font-size="13.5" font-weight="400" fill="#2A2433" xml:space="preserve">B12</text><text x="18" y="321.78" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Benachrichtige mich</text><rect x="18" y="335.78" width="354" height="294.0" rx="22" fill="#FFFFFF"/><text x="32" y="369.78" font-family="Nunito" font-size="14.5" font-weight="400" fill="#2A2433" xml:space="preserve">Plan für morgen geändert</text><text x="32" y="388.78" font-family="Nunito" font-size="12" font-weight="400" fill="#978FA1" xml:space="preserve">Sobald die Schule ihn ändert</text><rect x="316" y="361.78" width="42" height="24" rx="12" fill="#6C4DF6"/><rect x="336" y="363.78" width="20" height="20" rx="10" fill="#FFFFFF"/><line x1="32" y1="409.28" x2="358" y2="409.28" stroke="#F0EAE2" stroke-width="1"/><text x="32" y="443.28" font-family="Nunito" font-size="14.5" font-weight="400" fill="#2