 y="682" width="354" height="59.69" rx="16" fill="#F3EDE5"/><g transform="translate(31 694) scale(0.67 0.67)" fill="none" stroke="#6A6275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g><text x="57" y="706.0" font-family="Nunito" font-size="13" font-weight="400" fill="#6A6275" xml:space="preserve">Fällt heute eine Stunde aus, kommt das</text><text x="57" y="724.85" font-family="Nunito" font-size="13" font-weight="400" fill="#6A6275" xml:space="preserve">nach der Ruhezeit – wenn es noch stimmt.</text><rect x="18" y="758" width="354" height="48" rx="24.0" fill="#6C4DF6"/><g transform="translate(154.03 774.0) scale(0.67 0.67)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></g><text x="207.0" y="787.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Fertig</text></svg>