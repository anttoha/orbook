<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900"><rect x="0" y="0" width="390" height="900" fill="#FBF7F2"/><text x="18" y="33" font-family="Nunito" font-size="12.5" font-weight="800" fill="#978FA1" xml:space="preserve">Admin · 9b</text><text x="18" y="68" font-family="Nunito" font-size="29" font-weight="900" letter-spacing="-0.43" fill="#2A2433" xml:space="preserve">Kurse und Fächer</text><text x="18" y="100" font-family="Nunito" font-size="14" font-weight="400" fill="#6A6275" xml:space="preserve">Gilt für die ganze Klasse, auf allen Geräten.</text><circle cx="195" cy="360" r="32" fill="#EEE9FF"/><g transform="translate(183 348) scale(1 1)" fill="none" stroke="#4A31C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></g><text x="195" y="432" font-family="Nunito" font-size="25" font-weight="900" letter-spacing="-0.37" fill="#2A2433" text-anchor="middle" xml:space="preserve">Nicht geladen</text><text x="195" y="464" font-family="Nunito" font-size="14" font-weight="400" fill="#6A6275" text-anchor="middle" xml:space="preserve">Die Einstellungen kommen gerade nicht an.</text><text x="195" y="484" font-family="Nunito" font-size="14" font-weight="400" fill="#6A6275" text-anchor="middle" xml:space="preserve">Prüf die Verbindung und versuch es erneut.</text><rect x="34" y="512" width="322" height="48" rx="24" fill="#6C4DF6"/><g transform="translate(111.4 528) scale(0.67 0.67)" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></g><text x="207.0" y="541" font-family="Nunito" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Erneut versuchen</text></svg>