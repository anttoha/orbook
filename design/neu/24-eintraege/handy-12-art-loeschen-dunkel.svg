/><text x="55" y="385" font-family="Nunito" font-size="15.5" font-weight="400" fill="#F4F0F8" xml:space="preserve">Test</text><g transform="translate(320 372) scale(0.71 0.71)" fill="none" stroke="#B5ACC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></g><text x="38" y="430" font-family="Nunito" font-size="12" font-weight="400" fill="#877E94" xml:space="preserve">Die Liste ändert sich für alle in der Klasse.</text><rect x="38" y="462" width="153.0" height="48" rx="24.0" fill="#2A2533"/><text x="114.5" y="491.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#F4F0F8" text-anchor="middle" xml:space="preserve">Abbrechen</text><rect x="199.0" y="462" width="153.0" height="48" rx="24.0" fill="#3A1D25"/><g transform="translate(230.03500000000003 478.0) scale(0.67 0.67)" fill="none" stroke="#FF8AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></g><text x="287.5" y="491.0" font-family="Nunito" font-size="14.5" font-weight="700" fill="#FF8AA0" text-anchor="middle" xml:space="preserve">Löschen</text></svg>