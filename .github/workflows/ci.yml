# Проверки на каждый push и Pull Request (часть 49): сломанный код видно сразу в GitHub.
# Сервер выкладывает сам и этих проверок не ждёт — красный крестик значит «посмотри».
name: CI

on:
  push:
    branches: ["**"] # без тегов: они проверены ещё в main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm test # и регрессионные тесты части 47
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Android SDK на ubuntu-latest уже стоит; APK не собираем — только тесты на компьютере
      - run: ./gradlew --no-daemon testDemoDebugUnitTest
        working-directory: android
